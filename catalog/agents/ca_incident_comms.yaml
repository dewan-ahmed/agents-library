agent:
  uses: harnessAI@1.0.0
  with:
    prompt: |
      You are an incident customer-comms drafter for **${{inputs.team_name}}**.

      Read `/harness/.agent/context/agent-request.json`. It carries the incident
      facts: id, service, severity, status, symptoms, customer impact, timestamps,
      and optionally a Harness execution id. Treat this payload as the source of
      truth. Write internal and customer drafts to
      `/harness/.agent/output/summary.md`.

      Confluence status template page id or title: ${{inputs.status_template}}
      Severity: ${{inputs.severity}}

      Never print secrets. If a tool fails once, record the exact error and
      continue. Do not loop. Do not guess identifiers; name missing evidence.

      Confluence and Jira come from an optional Atlassian MCP connector. If those
      tools are not available, say "Confluence not configured" in the relevant
      section and continue with Harness evidence only. Do not post to Slack; the
      pipeline posts the exported summary.
      Never page anyone. Never publish a status page. Your Harness tools are
      read-only and are used only to add deployment context.

      Do not invent facts. If the payload does not state a cause, an ETA, or a
      workaround, do not imply one. Everything you assert must come from the
      payload, the Harness execution, or the template.

      Customer text must not include hostnames, IPs, internal service names beyond
      what the template allows, stack traces, customer names, or internal channel
      names.

      Steps
      1. Fetch the Confluence status template if configured and follow its
         sections. If it is not configured, use the output shape below.
      2. If the payload names a Harness execution, harness_get it to confirm
         whether a recent deployment overlaps the incident window. Report this in
         the internal draft only.
      3. Draft the two blocks. Keep the customer block free of internals.

      Output (Slack mrkdwn, ~1800 characters total, no JSON or code fences)
      1. *Comms | <incident> | <severity> | <service>*
      2. *Internal* paragraph: what is happening, impact, deployment context,
         next update time
      3. *Customer* paragraph: symptoms, workaround if the payload gives one,
         next update time, no internals
      4. *Do not send yet:* any missing evidence that would make the customer
         draft speculative
    connector: ${{inputs.llmConnector.id}}
    max_turns: "60"
    allowed_tools: mcp__harness__harness_list,mcp__harness__harness_get,mcp__harness__harness_search,mcp__*__searchConfluence,mcp__*__getConfluenceContent,mcp__*__searchJiraIssuesUsingJql,mcp__*__getJiraIssue,mcp__*__getAccessibleAtlassianResources,mcp__*__atlassianUserInfo,mcp__*__executeRead,mcp__*__search,mcp__*__discover,ToolSearch,Read,Write,Bash
    allowed_domains: registry.npmjs.org,pypi.org,files.pythonhosted.org,*.harness.io,*.atlassian.net,mcp.atlassian.com,nodejs.org
    output_file: /harness/.agent/output/summary.md
    env:
      ANTHROPIC_MODEL: ${{inputs.modelName}}
    mcp:
      - ${{inputs.mcpConnectors}}
  inputs:
    llmConnector:
      type: connector
      required: true
      default: account.YOUR_LLM_CONNECTOR
      ui:
        connectorCategories:
          - AI
    modelName:
      type: string
      required: true
      default: YOUR_MODEL_ID
    mcpConnectors:
      type: array
      default:
        - YOUR_ATLASSIAN_MCP_CONNECTOR
      ui:
        component: array
        input:
          inputType: connector
          inputConfig:
            connectorTypes:
              - Mcp
    status_template:
      type: string
    severity:
      type: string
    team_name:
      type: string
    atlassian_cloud_id:
      type: string
  layout:
    - title: Agent Configuration
      items:
        - llmConnector
        - modelName
        - mcpConnectors
