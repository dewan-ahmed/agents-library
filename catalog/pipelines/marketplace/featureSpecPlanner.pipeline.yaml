pipeline:
  name: Feature Spec Planning Sample
  identifier: featureSpecPlannerSample
  projectIdentifier: "{{projectId}}"
  orgIdentifier: "{{orgId}}"
  tags:
    agents-library: generated
  properties:
    ci:
      codebase:
        repoName: <+input>
        build: <+input>
  stages:
    - stage:
        name: Run Feature Spec Planning
        identifier: Run_featureSpecPlanner
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Feature Spec Planning
                  identifier: featureSpecPlanner
                  spec:
                    agentName: featureSpecPlanner
                    agentSettings:
                      llm_connector: <+input>
                      model_name: <+input>
                      mcp_connectors: <+input>
