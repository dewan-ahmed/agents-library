pipeline:
  name: Regression Repair Sample
  identifier: regressionFixerSample
  projectIdentifier: "{{projectId}}"
  orgIdentifier: "{{orgId}}"
  tags:
    agents-library: generated
  properties:
    ci:
      codebase:
        repoName: <+input>
        build: <+input>
  stages:
    - stage:
        name: Run Regression Repair
        identifier: Run_regressionFixer
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Regression Repair
                  identifier: regressionFixer
                  spec:
                    agentName: regressionFixer
                    agentSettings:
                      llm_connector: <+input>
                      model_name: <+input>.default(claude-sonnet-4-6)
