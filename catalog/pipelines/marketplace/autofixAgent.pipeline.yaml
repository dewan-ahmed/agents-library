pipeline:
  name: CI Failure Autofix Sample
  identifier: autofixAgentSample
  projectIdentifier: "{{projectId}}"
  orgIdentifier: "{{orgId}}"
  tags:
    agents-library: generated
  properties:
    ci:
      codebase:
        repoName: <+input>
        build: <+input>
  stages:
    - stage:
        name: Run CI Failure Autofix
        identifier: Run_autofixAgent
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: CI Failure Autofix
                  identifier: autofixAgent
                  spec:
                    agentName: autofixAgent
                    agentSettings:
                      llm_connector: <+input>
                      model_name: <+input>
