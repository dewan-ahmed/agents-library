pipeline:
  name: Verification Analysis Sample
  identifier: verificationAnalyzerSample
  projectIdentifier: "{{projectId}}"
  orgIdentifier: "{{orgId}}"
  tags:
    agents-library: generated
  properties:
    ci:
      codebase:
        repoName: <+input>
        build: <+input>
  stages:
    - stage:
        name: Run Verification Analysis
        identifier: Run_verificationAnalyzer
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Verification Analysis
                  identifier: verificationAnalyzer
                  spec:
                    agentName: verificationAnalyzer
                    agentSettings:
                      llm_connector: <+input>
