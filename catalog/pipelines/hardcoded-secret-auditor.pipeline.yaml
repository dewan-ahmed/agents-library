pipeline:
  name: Hardcoded Values Auditor
  identifier: hardcodedSecretAuditor
  projectIdentifier: "{{projectId}}"
  orgIdentifier: "{{orgId}}"
  tags: {}
  variables:
    - name: llmConnector
      type: String
      description: Account, org, or project LLM connector reference.
      required: true
      value: <+input>
    - name: modelName
      type: String
      description: Model identifier exposed by your LLM connector.
      required: true
      value: <+input>
    - name: mcpConnectors
      type: String
      description: Harness MCP connector identifier, for example YOUR_HARNESS_MCP_CONNECTOR.
      required: true
      value: <+input>
    - name: scopeOrgId
      type: String
      description: Org identifier to scan. Leave empty with an empty project id to scan the account.
      required: false
      value: <+input>
    - name: scopeProjectId
      type: String
      description: Project identifier to scan. Requires scopeOrgId when set.
      required: false
      value: <+input>
    - name: severityThreshold
      type: String
      description: Minimum severity to report. One of low, medium, or high.
      required: true
      value: <+input>.default(medium)
  stages:
    - stage:
        name: Audit Hardcoded Values
        identifier: audit_hardcoded_values
        type: CI
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Hardcoded Values Auditor
                  identifier: hardcoded_secret_auditor
                  spec:
                    agentName: ca_hardcoded_secret_auditor
                    agentSettings:
                      llmConnector: <+pipeline.variables.llmConnector>
                      modelName: <+pipeline.variables.modelName>
                      mcpConnectors: <+pipeline.variables.mcpConnectors>
                      scopeOrgId: <+pipeline.variables.scopeOrgId>
                      scopeProjectId: <+pipeline.variables.scopeProjectId>
                      severityThreshold: <+pipeline.variables.severityThreshold>
              - step:
                  type: Run
                  name: Export Audit Report
                  identifier: export_audit_report
                  spec:
                    shell: Sh
                    command: |
                      if [ -f audit-report.md ]; then
                        echo "=== audit-report.md ==="
                        cat audit-report.md
                      elif [ -f /harness/audit-report.md ]; then
                        echo "=== /harness/audit-report.md ==="
                        cat /harness/audit-report.md
                      else
                        echo "No audit-report.md was written."
                      fi
