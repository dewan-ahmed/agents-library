pipeline:
  name: Zuul Documentation Generator
  identifier: Zuul_Documentation_Generator
  projectIdentifier: dewanahmed
  orgIdentifier: SANDBOX
  tags: {}
  properties:
    ci:
      codebase:
        repoName: zuul
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Generate Documentation
        identifier: Generate_Documentation
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Agent
                  name: Documentation Agent
                  identifier: Documentation_Agent
                  spec:
                    agentName: ca_documentation_generator
                    agentSettings:
                      llmConnector: account.harnessAnthropic
                      modelName: claude-sonnet-4-6
              - step:
                  type: Run
                  name: Commit Generated Docs
                  identifier: Commit_Generated_Docs
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      git config user.email "docs-agent@harness.io"
                      git config user.name  "Docs Agent"
                      git add docs/
                      if git diff --cached --quiet; then
                        echo "No documentation changes to commit."
                        exit 0
                      fi
                      BRANCH="docs/agent-update-<+pipeline.sequenceId>"
                      git checkout -b "$BRANCH"
                      git commit -m "docs: agent-generated update

                      Regenerated docs/ via Documentation Agent.
                      Pipeline: <+pipeline.executionUrl>"
                      git push origin "$BRANCH"
